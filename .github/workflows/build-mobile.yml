          with:
              files: |
                  Build/iOS/PopsignAI/*.ipa
                  Build/iOS/*.ipa
                  Build/Android/*.apk
                  ${{ github.workspace }}/Build/.iOS-Workspace/Unity-iPhone.xcodeproj
                  ${{ github.workspace }}/Build/.iOS-Workspace/Unity-iPhone.xcarchive
