        - name: Build iOS Workspace
          run: |
            # ensure downloaded keychain is in the user's keychain list
            security list-keychain -d user -s $KEYCHAIN_PATH || true
            /Applications/Unity/Hub/Editor/6000.0.26f1/Unity.app/Contents/MacOS/Unity \
              -batchmode \
              -quit \
              -projectPath "${{ github.workspace }}" \
              -executeMethod PopsignAIBuilder.BuildGameiOS \
              -logFile iosWorkspace.log

        - name: Upload xcodeproj as artifact
          uses: actions/upload-artifact@v4
          with:
            name: xcodeproj-contents
            path: ${{ github.workspace }}/Build/.iOS-Workspace/Unity-iPhone.xcodeproj
            
