---
name: Build and Release on Mobile
on: [push, workflow_dispatch]
env:
  RUNNER_TOOL_CACHE: ${{ github.workspace }}/.toolcache
  RUNNER_TEMP: ${{ github.workspace }}/_temp
  KEYCHAIN_PATH: ${{ github.workspace }}/keychains/app-signing.keychain-db
permissions:
    contents: write
jobs:
    setup:
      runs-on: [self-hosted, macOS]
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Install the Apple certificate and provisioning profile
          env:
            BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
            P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
            BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
            KEYCHAIN_PASSWORD: "abc123"
          run: |
            # create variables
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision

            # import certificate and provisioning profile from secrets
            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

            # create temporary keychain
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            # security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            # import certificate to keychain
            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH

            # apply provisioning profile
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

        - name: Upload keychain artifact
          uses: actions/upload-artifact@v4
          with:
            name: app-signing-keychain
            path: ${{ env.KEYCHAIN_PATH }}

        - name: Install Python & Cocoapods via Homebrew
          run: |
            brew update
            arch -arm64 brew install python || true
            python3 --version 
            pip3 --version
            brew install cocoapods
        
        - name: Config SLRTK
          run: |
            pip3 install slrtk
            echo "Python libs installed"
            slrtk gtk install --unity --path .

        # todo split up unity license and apple certs into a new job

        - name: Activate Unity License
          run: |
              /Applications/Unity/Hub/Editor/6000.0.26f1/Unity.app/Contents/MacOS/Unity \
                -batchmode \
                -quit \
                -logFile build.log \
                -username "${{ secrets.UNITY_EMAIL }}" \
                -password "${{ secrets.UNITY_PASSWORD }}" \
                -serial "${{ secrets.UNITY_SERIAL }}"

        # - name: Clean Up Old Keychain
        #   run: rm -f signing_temp.keychain

        # - name: Import Code Signing Certificate
        #   uses: apple-actions/import-codesign-certs@v3
        #   with: 
        #     p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        #     p12-password: ${{ secrets.P12_PASSWORD }}

        # - name: 3. Install Provisioning Profile
        #   env:
        #     PROVISIONING_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        #   run: |
        #     PROFILE_PATH="~/Library/MobileDevice/Provisioning Profiles/temp.mobileprovision"
        #     mkdir -p "$(dirname "$PROFILE_PATH")"
        #     echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
        #     echo "Installed provisioning profile."
        


    build-ios:
      runs-on: [self-hosted, macOS]
