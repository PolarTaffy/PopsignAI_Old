    release-files: 
      runs-on: [self-hosted, macOS]
      needs: [build-ios]
      # needs: [build-android, build-ios]
      steps: 

        - name: Download Build Artifact
          uses: actions/download-artifact@v4
          with:
            name: build-output
            path: ./Build/

        - name: Create Release
          uses: softprops/action-gh-release@v2
          with:
              files: |
                  Build/iOS/PopsignAI/*.ipa
                  Build/Android/*.apk
                  Build/.iOS-Workspace/*.xcodeproj
                  ./Build/.iOS-Workspace/Unity-iPhone.xcodeproj
                  Build/.iOS-Workspace/*.xarchive
              tag_name: BOTH-release-${{ github.run_number }}
