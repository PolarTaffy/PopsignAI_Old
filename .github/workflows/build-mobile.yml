---
name: Build and Release on Mobile
on: [push, workflow_dispatch]
env:
  RUNNER_TOOL_CACHE: ${{ github.workspace }}/.toolcache
  RUNNER_TEMP: ${{ github.workspace }}/_temp
permissions:
    contents: write
jobs:
    setup:
      runs-on: [self-hosted, macOS]
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Homebrew Python
          run: |
            brew update
            arch -arm64 brew install python || true
            python3 --version
            pip3 --version
            brew install cocoapods
        
        - name: Config SLRTK
          run: |
            pip3 install slrtk
            echo "Python libs installed"
            slrtk gtk install --unity --path .

        - name: Activate Unity License
          run: |
              /Applications/Unity/Hub/Editor/6000.0.26f1/Unity.app/Contents/MacOS/Unity \
                -batchmode \
                -quit \
                -logFile build.log \
                -username "${{ secrets.UNITY_EMAIL }}" \
                -password "${{ secrets.UNITY_PASSWORD }}" \
                -serial "${{ secrets.UNITY_SERIAL }}"

    
    build-ios:
      runs-on: [self-hosted, macOS]
      needs: setup
      steps:
        - name: Build iOS Workspace
          run: |
            /Applications/Unity/Hub/Editor/6000.0.26f1/Unity.app/Contents/MacOS/Unity \
              -batchmode \
              -quit \
              -projectPath "${{ github.workspace }}" \
              -executeMethod PopsignAIBuilder.BuildGameiOS \
              -logFile iosWorkspace.log

        - name: Upload Build Log
          uses: actions/upload-artifact@v4
          with:
            name: build-log-ios
            path: iosWorkspace.log

        - name: DEBUG List all workplace files
          run: ls -AR > listing_after_wkspc.txt

        - name: Upload Workplace Files
          uses: actions/upload-artifact@v4
          with:
            name: dirs-after-ios-work
            path: listing_after_wkspc.txt

        - name: DEBUG List before build artifact
          run: ls -AR > listing_after_wkspc.txt

        - name: Upload Build Artifact
          uses: actions/upload-artifact@v4
          with:
            name: xcodeproj-contents
            path: ${{ github.workspace }}/Build/.iOS-Workspace/Unity-iPhone.xcodeproj

        - name: Build and Sign .ipa
          run: |
            # Define paths for clarity
            WORKSPACE_PATH="${{ github.workspace }}/Build/.iOS-Workspace/Unity-iPhone.xcworkspace"
            ARCHIVE_PATH="${{ github.workspace }}/Build/iOS/PopsignAI.xcarchive"
            EXPORT_PATH="${{ github.workspace }}/Build/iOS/"
            EXPORT_OPTIONS_PLIST="${{ github.workspace }}/ExportOptions.plist"

            echo ">>> Creating ExportOptions.plist"
            cat << EOF > $EXPORT_OPTIONS_PLIST
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>method</key>
                <string>development</string>
                <key>teamID</key>
                <string>${{ secrets.APPLE_TEAM_ID }}</string>
                <key>signingStyle</key>
                <string>automatic</string>
            </dict>
            </plist>
            
            echo ">>> Archiving the project..."
            xcodebuild archive \
              -workspace "$WORKSPACE_PATH" \
              -scheme "Unity-iPhone" \
              -sdk iphoneos \
              -configuration "Release" \
              -archivePath "$ARCHIVE_PATH" \
              -allowProvisioningUpdates \
              DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

            echo ">>> Exporting the .ipa..."
            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportPath "$EXPORT_PATH" \
              -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"

        - name: DEBUG List all workplace files
          run: ls -AR > listing_after_gen.txt

        - name: Upload Workplace Files
          uses: actions/upload-artifact@v4
          with:
            name: dirs-after-ipa
            path: listing_after_ipa.txt

