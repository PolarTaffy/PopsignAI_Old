---
name: Build and Release on Mobile
on: [push, workflow_dispatch]
env:
  RUNNER_TOOL_CACHE: ${{ github.workspace }}/.toolcache
  RUNNER_TEMP: ${{ github.workspace }}/_temp
permissions:
    contents: write
jobs:
    setup:
      runs-on: [self-hosted, macOS]
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Homebrew Python
          run: |
            brew update
            arch -arm64 brew install python || true
            python3 --version
            pip3 --version
        
        - name: Config SLRTK
          run: |
            pip3 install slrtk
            echo "Python libs installed"
            slrtk gtk install --unity --path .

        - name: Activate Unity License
          run: |
              /Applications/Unity/Hub/Editor/6000.0.26f1/Unity.app/Contents/MacOS/Unity \
                -batchmode \
                -quit \
                -logFile build.log \
                -username "${{ secrets.UNITY_EMAIL }}" \
                -password "${{ secrets.UNITY_PASSWORD }}" \
                -serial "${{ secrets.UNITY_SERIAL }}"

    build-android:
        runs-on: [self-hosted, macOS]
        needs: setup
        #TODO: Make step for putting it on the android phone with ADB (3/4)
        steps:
          - name: Build Android with Unity
            run: |
                /Applications/Unity/Hub/Editor/6000.0.26f1/Unity.app/Contents/MacOS/Unity \
                -batchmode \
                -quit \
                -projectPath "${{ github.workspace }}" \
                -executeMethod PopsignAIBuilder.BuildGameAndroid \
                -logFile -

            #MANAGE BUILD ERRORS        
          - name: Upload Build Log
            uses: actions/upload-artifact@v4
            with:
              name: build-log-android
              path: build.log

          - name: Create Release
            uses: softprops/action-gh-release@v2
            with:
                files: |
                    Build/Android/*.apk
                tag_name: release-${{ github.run_number }}-${{ github.sha }}
                token: ${{ secrets.GITHUB_TOKEN }}
            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            
          - name: Deploy to Android Device
            run: | 
                echo "It's Honey-G"

    build-ios:
      runs-on: [self-hosted, macOS]
      needs: setup
      steps:
        - name: Build iOS Workspace
          run: |
            /Applications/Unity/Hub/Editor/6000.0.26f1/Unity.app/Contents/MacOS/Unity \
              -batchmode \
              -quit \
              -projectPath "${{ github.workspace }}" \
              -executeMethod PopsignAIBuilder.BuildGameiOS \
              -logFile -

        - name: Build iOS Publishing Archive
          run: |
            /Applications/Unity/Hub/Editor/6000.0.26f1/Unity.app/Contents/MacOS/Unity \
              -batchmode \
              -quit \
              -projectPath "${{ github.workspace }}" \
              -executeMethod PopsignAIBuilder.BuildArchiveiOS \
              -logFile -

        - name: Export iOS Publishing Package
          run: |
            /Applications/Unity/Hub/Editor/6000.0.26f1/Unity.app/Contents/MacOS/Unity \
              -batchmode \
              -quit \
              -projectPath "${{ github.workspace }}" \
              -executeMethod PopsignAIBuilder.ExportGameiOS \
              -logFile -
        
        - name: Generate iOS Publishing Manifest
          run: |
            /Applications/Unity/Hub/Editor/6000.0.26f1/Unity.app/Contents/MacOS/Unity \
              -batchmode \
              -quit \
              -projectPath "${{ github.workspace }}" \
              -executeMethod PopsignAIBuilder.GenerateiOSManifest \
              -logFile -

        - name: Upload Build Log
          uses: actions/upload-artifact@v4
          with:
            name: build-log-ios
            path: build-ios.log

        - name: Create Release
          uses: softprops/action-gh-release@v2
          with:
              files: |
                  Build/iOS/PopsignAI/*.ipa
              tag_name: release-${{ github.run_number }}-${{ github.sha }}
              token: ${{ secrets.GITHUB_TOKEN }}
          env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
    release-files: 
      runs-on: [self-hosted, macOS]
      needs: [build-android, build-ios]
      steps: 

        - name: Create Release
          uses: softprops/action-gh-release@v2
          with:
              files: |
                  Build/iOS/PopsignAI/*.ipa
                  Build/Android/*.apk
              tag_name: BOTH-release-${{ github.run_number }}-${{ github.sha }}
              token: ${{ secrets.GITHUB_TOKEN }}
          env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
    #TODO move the create android release to its own job where it releases both android and ios at the same time
    #it'll be like... make release
            
...
