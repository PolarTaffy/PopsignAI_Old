---
name: Build and Release on Mobile
on: [push, workflow_dispatch]
env:
  RUNNER_TOOL_CACHE: ${{ github.workspace }}/.toolcache
  RUNNER_TEMP: ${{ github.workspace }}/_temp
permissions:
    contents: write
jobs:
    setup:
      runs-on: [self-hosted, macOS]
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Install Python & Cocoapods via Homebrew
          run: |
            brew update
            arch -arm64 brew install python || true
            python3 --version 
            pip3 --version
            brew install cocoapods
        
        - name: Config SLRTK
          run: |
            pip3 install slrtk
            echo "Python libs installed"
            slrtk gtk install --unity --path .

        - name: Activate Unity License
          run: |
              /Applications/Unity/Hub/Editor/6000.0.26f1/Unity.app/Contents/MacOS/Unity \
                -batchmode \
                -quit \
                -logFile build.log \
                -username "${{ secrets.UNITY_EMAIL }}" \
                -password "${{ secrets.UNITY_PASSWORD }}" \
                -serial "${{ secrets.UNITY_SERIAL }}"

        - name: Clean Up Old Keychain
          run: rm -f signing_temp.keychain

        - name: Import Code Signing Certificate
          uses: apple-actions/import-codesign-certs@v3
          with: 
            p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
            p12-password: ${{ secrets.P12_PASSWORD }}

        - name: 3. Install Provisioning Profile
          env:
            PROVISIONING_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          run: |
            PROFILE_PATH="~/Library/MobileDevice/Provisioning Profiles/temp.mobileprovision"
            mkdir -p "$(dirname "$PROFILE_PATH")"
            echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
            echo "Installed provisioning profile."

    build-ios:
      runs-on: [self-hosted, macOS]
      needs: setup
      steps:
        - name: Build iOS Workspace
          run: |
            /Applications/Unity/Hub/Editor/6000.0.26f1/Unity.app/Contents/MacOS/Unity \
              -batchmode \
              -quit \
              -projectPath "${{ github.workspace }}" \
              -executeMethod PopsignAIBuilder.BuildGameiOS \
              -logFile iosWorkspace.log

        - name: Upload xcodeproj as artifact
          uses: actions/upload-artifact@v4
          with:
            name: xcodeproj-contents
            path: ${{ github.workspace }}/Build/.iOS-Workspace/Unity-iPhone.xcodeproj
            
        - name: Build the Archive
          run: |
            xcodebuild archive
              \-project ${{ github.workspace }}/Build/.iOS-Workspace/Unity-iPhone.xcodeproj
              \-configuration Release
              \-destination 'generic/platform=iOS'
              \-archivePath $RUNNER_TEMP/YourApp.xcarchive \
              \-archivePath ${{ github.workspace }}/Build/.iOS-Workspace/Unity-iPhone.xcarchive \
              CODE_SIGN_IDENTITY="iPhone Distribution: Thad Starner (JQA766K6N5)" \
              PROVISIONING_PROFILE_SPECIFIER="Evan Provisioning Profile" \
              OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/app-signing.keychain-db" # Use the keychain from step 2



